services:
  musicvault:
    build: .
    container_name: musicvault
    ports:
      - "8081:8081"
    volumes:
      - ./downloads:/app/downloads
      - ./data:/app/data
      - ./config:/app/config
    environment:
      - PYTHONUNBUFFERED=1
      # Refresh yt-dlp on container start (set to 0 to pin the built-in version)
      - MV_UPDATE_YTDLP=1
      # Set a value to require a shared token on every request. Strongly
      # recommended if this port is reachable beyond localhost.
      # - MV_AUTH_TOKEN=change-me
    command: python server.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
